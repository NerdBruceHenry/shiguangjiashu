<title>时光匣</title>
<style>
body{margin:0;background:#141b34;color:#e9ecf7;font:17px/1.8 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px}
input,button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #47527c;background:#202a4b;color:inherit;width:100%;box-sizing:border-box}
button{cursor:pointer;margin-top:10px}button:disabled{opacity:.6;cursor:default}
.item{display:flex;justify-content:space-between;gap:12px;text-align:left}small{color:#b9c1de}
.paper{background:#f7f5ee;color:#222a3a;padding:24px;border-radius:6px;margin-top:10px}.text{white-space:pre-wrap}.q{color:#6a5f4b;margin-bottom:0}
img{max-width:100%;margin-top:12px}audio{width:100%;margin-top:12px}#msg{color:#ffc978;min-height:1.8em}
</style>

<body>
<main>
<h1>写给 <span id="name"></span> 的时光匣</h1>
<p id="info"></p>
<form id="form"><label for="pass">输入口令或恢复码</label><input id="pass" type="password" autocomplete="off" required><button>打开时光匣</button></form>
<p id="msg" role="status"></p>
<div id="list"></div>
<p><small>这个文件可以离线打开，信件是加密的。请多存几份，放在不同的地方。没到日期的信在这里也打不开。</small></p>
</main>
